[package]
name = "twep-teep-agent"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/s-miyazawa/twep-system"

[lib]
crate-type = ["cdylib"]

[features]
# Rebuild the historical M9.1 acceptance-only boundary for its live smoke.
# Production/default builds remain on the M9.2 Catalog-only coordinator.
m9-1-acceptance-only-smoke = []

[dependencies]
ciborium = { version = "0.2", default-features = false }
coset = { version = "0.4.2", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
